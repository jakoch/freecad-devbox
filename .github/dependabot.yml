# dependabot.yml
#
# Dependabot updates dependencies automatically to their latest versions.
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Enable automatic version updates for Github Actions
  - package-ecosystem: "github-actions"
    # Look for `.github/workflows` in the `root` directory
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps(gha): "
    labels:
      - "dependencies"
    # ignore all patch level updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  # Enable automatic version updates for the Dockerfiles. dependabot takes one
  # directory per entry, and its docker ecosystem only picks up Dockerfiles at
  # the root of that directory - so each variant needs its own entry rather than
  # a shared parent. The leading dot matters: without it dependabot matches
  # nothing at all and fails silently.
  - package-ecosystem: "docker"
    directory: "/.devcontainer/debian/13-trixie"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps(docker): "
    labels:
      - "dependencies"
    # ignore all patch level updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  - package-ecosystem: "docker"
    directory: "/.devcontainer/debian/14-forky"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps(docker): "
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  - package-ecosystem: "docker"
    directory: "/.devcontainer/debian/sid-unstable"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps(docker): "
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
